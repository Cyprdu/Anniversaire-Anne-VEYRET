<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* Animation des particules flottantes */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* En-tête principal */
        .header {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .header h1 {
            font-size: 4em;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            animation: fadeInDown 1s ease-out;
        }

        .header p {
            font-size: 1.5em;
            opacity: 0.95;
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        .birthday-icon {
            font-size: 5em;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Conteneur principal */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Compteur de messages */
        .counter {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 1s ease-out 0.6s both;
        }

        .counter-box {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            border-radius: 50px;
            color: white;
            font-size: 1.3em;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .counter-number {
            font-size: 2em;
            font-weight: bold;
            color: #ffd700;
        }

        /* Filtres */
        .filters {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 1s ease-out 0.8s both;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 30px;
            margin: 5px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .filter-btn.active {
            background: white;
            color: #667eea;
            font-weight: bold;
        }

        /* Grille de cartes */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            padding: 20px 0;
        }

        /* Cartes individuelles */
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: fadeInScale 0.6s ease-out both;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
            background-size: 200% 100%;
            animation: gradientMove 3s ease infinite;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5em;
            font-weight: bold;
            margin-right: 15px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .card-info {
            flex: 1;
        }

        .card-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .card-date {
            font-size: 0.9em;
            color: #888;
        }

        .card-message {
            line-height: 1.8;
            color: #555;
            font-size: 1.05em;
            white-space: pre-wrap;
            position: relative;
            padding-left: 20px;
        }

        .card-message::before {
            content: '"';
            position: absolute;
            left: 0;
            top: -10px;
            font-size: 3em;
            color: #667eea;
            opacity: 0.3;
        }

        .card-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .heart-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #ccc;
        }

        .heart-btn:hover, .heart-btn.liked {
            color: #ff6b6b;
            transform: scale(1.3);
        }

        /* Message vide */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .empty-state-icon {
            font-size: 5em;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Barre de recherche */
        .search-container {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn 1s ease-out 1s both;
        }

        .search-box {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 15px 50px 15px 20px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.3em;
            color: #667eea;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 40px 20px;
            color: white;
            margin-top: 60px;
        }

        .footer-heart {
            font-size: 2em;
            color: #ff6b6b;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            10%, 30% { transform: scale(1.1); }
            20%, 40% { transform: scale(1); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5em;
            }

            .header p {
                font-size: 1.2em;
            }

            .cards-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .filter-btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Effet confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f0f;
            position: absolute;
            animation: confetti-fall 3s linear infinite;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Stats bubble */
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 20px;
            color: white;
            text-align: center;
            min-width: 150px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            animation: fadeIn 1s ease-out both;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #ffd700;
            display: block;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-top: 5px;
        }
    </style>
</head>
<body>

            const particlesContainer = document.getElementById('particles');

            const date = new Date(dateString);
            const options = { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' };
            return date.toLocaleDateString('fr-FR', options);

                'linear-gradient(135deg, #a8edea, #fed6e3)',
                'linear-gradient(135deg, #ff9a9e, #fecfef)'
            ];
            const index = name.charCodeAt(0) % colors.length;
            return colors[index];

                    <div class="empty-state">
                        <div class="empty-state-icon">😢</div>
                        <h2>Aucun message trouvé</h2>
                        <p>Essayez de modifier votre recherche</p>
                    </div>
                `;
                return;
            }

            messagesToRender.forEach((msg, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = (index * 0.1) + 's';

                const initials = getInitials(msg["Votre Prénom"], msg["Votre Nom"]);
                const fullName = `${msg["Votre Prénom"]} ${msg["Votre Nom"]}`;
                const avatarColor = getRandomColor(fullName);

                card.innerHTML = `
                    <div class="card-header">
                        <div class="avatar" style="background: ${avatarColor};">
                            ${initials}
                        </div>
                        <div class="card-info">
                            <div class="card-name">${fullName}</div>
                            <div class="card-date">${formatDate(msg["Horodateur"])}</div>
                        </div>
                    </div>
                    <div class="card-message">${msg["Votre mot pour Anne"]}</div>
                    <div class="card-footer">
                        <button class="heart-btn" onclick="toggleLike(${index})">
                            ${likedCards.has(index) ? '❤️' : '🤍'}
                        </button>
                        <span style="color: #999; font-size: 0.9em;">
                            ${msg["Votre mot pour Anne"].split(/\s+/).length} mots
                        </span>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // Toggle like
        function toggleLike(index) {
            if (likedCards.has(index)) {
                likedCards.delete(index);
            } else {
                likedCards.add(index);
            }
            renderCards(filteredMessages);
        }

        // Configuration des écouteurs d'événements
        function setupEventListeners() {
            // Filtres
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    const filter = this.getAttribute('data-filter');
                    applyFilter(filter);
                });
            });

            // Recherche
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase();
                filterBySearch(searchTerm);
            });
        }

        // Appliquer les filtres
        function applyFilter(filter) {
            let sorted = [...messages];

            switch(filter) {
                case 'recent':
                    sorted.sort((a, b) => new Date(b.Horodateur) - new Date(a.Horodateur));
                    break;
                case 'longest':
                    sorted.sort((a, b) => 
                        b["Votre mot pour Anne"].length - a["Votre mot pour Anne"].length
                    );
                    break;
                default:
                    sorted = [...messages];
            }

            filteredMessages = sorted;
            renderCards(sorted);
        }

        // Filtrer par recherche
        function filterBySearch(searchTerm) {
            if (searchTerm === '') {
                filteredMessages = [...messages];
                renderCards(messages);
                return;
            }

            const filtered = messages.filter(msg => {
                const fullName = `${msg["Votre Prénom"]} ${msg["Votre Nom"]}`.toLowerCase();
                const message = msg["Votre mot pour Anne"].toLowerCase();
                return fullName.includes(searchTerm) || message.includes(searchTerm);
            });

            filteredMessages = filtered;
            renderCards(filtered);
        }

        // Rendre toggleLike global
        window.toggleLike = toggleLike;
    </script>
</body>
</html>
